name: CI

concurrency: python-ci

on:
    push:
        branches: [develop]
        paths:
            - "src/**"
            - "tests/**"
            - setup.cfg
            - setup.py
            - pyproject.toml
            - tox.ini
            - "requirements/*.txt"
            - ".github/workflows/**"
    pull_request:
        branches: [develop, master]
    workflow_dispatch:
    repository_dispatch:
        types:
            - dependency-updated

jobs:
    tests:
        name: Build/test on ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write
        concurrency: ci-${{ github.ref }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux
                      os: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - name: Get language version
              id: get_lang_version
              run: |
                    v=$(cat .python-version)
                    echo "lang_version=$v" >> $GITHUB_OUTPUT
                    t=$(cat .tox-env)
                    echo "tox_env=$t" >> $GITHUB_OUTPUT
            - uses: actions/setup-python@v6
              with:
                  python-version: ${{ steps.get_lang_version.outputs.lang_version }}
            - name: update-pip
              run: |
                  pip install -U wheel
                  pip install -U setuptools
                  python -m pip install -U pip
            - name: get-pip-cache-dir
              id: pip-cache
              run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
            - name: cache-pip
              uses: actions/cache@v5
              with:
                  path: ${{ steps.pip-cache.outputs.dir }}
                  key: pip|${{ runner.os }}|${{ steps.get_lang_version.outputs.lang_version }}|${{ hashFiles('setup.py') }}|${{ hashFiles('requirements/*.txt') }}
            - name: install-utils
              run: pip install tox
            - name: tests
              run: |
                  tox -e ${{ steps.get_lang_version.outputs.tox_env }}
            - name: coverage-summary
              run: |
                  echo "## Python coverage" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  tox exec -e ${{ steps.get_lang_version.outputs.tox_env }} -- coverage report -m >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  mkdir -p coverage-pages
                  tox exec -e ${{ steps.get_lang_version.outputs.tox_env }} -- coverage xml -o coverage-pages/coverage.xml
                  tox exec -e ${{ steps.get_lang_version.outputs.tox_env }} -- coverage html -d coverage-pages/htmlcov
            - name: upload-coverage-artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report-${{ matrix.name }}
                  path: coverage-pages/
            - name: coverage-threshold
              continue-on-error: true
              run: tox exec -e ${{ steps.get_lang_version.outputs.tox_env }} -- coverage report --fail-under=0
            - name: coverage-badge
              continue-on-error: true
              run: |
                  PCT=$(tox exec -e ${{ steps.get_lang_version.outputs.tox_env }} -- coverage report --format=total | grep -E '^[0-9]+$' | tail -1)
                  COLOR=$(awk -v p="$PCT" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
                  printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
                      "$PCT" "$COLOR" > coverage-pages/coverage-badge.json
            - name: publish-coverage
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./coverage-pages
                  keep_files: true

    publish:
        needs: [tests]
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        concurrency: publish
        permissions:
            id-token: write
            contents: write
        steps:
            - uses: actions/checkout@v6
              with:
                fetch-depth: 0
                token: ${{ secrets.GITHUB_TOKEN }}
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
            - name: install-semantic-release
              run: pip install python-semantic-release build
            - name: release
              id: release
              run: |
                  git config user.name github-actions
                  git config user.email github-actions@github.com
                  current=$(semantic-release version --print-last-released || echo "none")
                  next=$(semantic-release version --print)
                  if [ "$current" = "$next" ]; then
                      echo "released=false" >> "$GITHUB_OUTPUT"
                  else
                      semantic-release version --commit --tag --push --changelog --vcs-release
                      echo "released=true" >> "$GITHUB_OUTPUT"
                  fi
            - name: publish to PyPI
              if: steps.release.outputs.released == 'true'
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                user: __token__
                password: ${{ secrets.PYPI_TOKEN }}
